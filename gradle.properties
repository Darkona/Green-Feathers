org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.2
java_version=25
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88
neo_version_range=[26.2.0.88,)
loader_version_range=[11,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.1
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

# Optional compat targets: Modrinth version ids for NeoForge 26.2 (the version number in the comment), since many
# mods share version numbers between their NeoForge and Fabric files.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository)
ci_deps=droplets-of-thirst:droplets_of_thirst_version
droplets_of_thirst_version=26.2-1.0.0
# Tough As Nails 21.11.0.8
tough_as_nails_version=UEvvcLc2
# Serene Seasons 26.1.2.0.6, the newest build for 26.2 despite its number
serene_seasons_version=MZd2wAtJ
# GlitchCore 26.2.0.0.0
glitchcore_version=POAebwFo
# AppleSkin 3.0.10+mc26.2
appleskin_version=slnk1Qah
# Jade 26.2.10+neoforge
jade_version=GBES6etT
# Overflowing Bars 26.2.0 and Puzzles Lib 26.2.4
overflowing_bars_version=WZzzzt7w
puzzles_lib_version=7Y7PIhiq
# Naturalist 2.0.6+26.2-neoforge and GeckoLib 5.5.6
naturalist_version=iaqiPc74
geckolib_version=IEGPh4CJ
curios_version=16.0.0+26.2
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
droplets_of_thirst_range=[26.2-1.0.0,26.2-2)
tough_as_nails_range=[21.11.0.8,22)
serene_seasons_range=[26.1.2.0.6,26.1.3)
overflowing_bars_range=[26.2.0,26.3)
curios_range=[16.0.0,17)
jade_range=[26.2.10,26.3)
