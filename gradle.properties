org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.19.2
parchment_mappings_version=2022.11.27

minecraft_version=1.19.2
java_version=17
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=1.19.2
minecraft_version_range=[1.19.2]
forge_version=43.5.2
forge_version_range=[43.5.2,)
loader_version_range=[43,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.1
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

mixinextras_version=0.4.1

# Optional compat targets (Modrinth version ids, 1.19.2 Forge; the version number is in the comment)
# Cold Sweat 2.4.3
cold_sweat_version=YeDAa4JT
# Thirst Was Taken 1.19.2-1.3.11
thirst_was_taken_version=z9PJMoQg
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository)
ci_deps=droplets-of-thirst:droplets_of_thirst_version
droplets_of_thirst_version=1.19.2-1.0.0
# Tough As Nails 8.0.0.78
tough_as_nails_version=lVYKR10d
# Serene Seasons 8.1.0.24
serene_seasons_version=O1v6mc2V
# AppleSkin forge-mc1.19-2.4.2
appleskin_version=YRzksfaH
# Jade 8.9.2
jade_version=kp0HjPre
# Naturalist 4.0.3
naturalist_version=YjWRWE02
# GeckoLib 3.1.40
geckolib_version=lxzmD9V4
# Overflowing Bars v4.0.1-1.19.2-Forge
overflowing_bars_version=H2znAbYq
# Puzzles Lib v4.4.3-1.19.2-Forge
puzzles_lib_version=UbCrBSit
curios_version=1.19.2-5.1.6.4
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
cold_sweat_range=[2.4.3,3)
thirst_range=[1.19.2-1.3.11,1.19.2-2)
droplets_of_thirst_range=[1.19.2-1.0.0,1.19.2-2)
overflowing_bars_range=[4.0.1,5)
curios_range=[1.19.2-5.1.6.4,1.19.2-6)
jade_range=[8.9.2,9)
