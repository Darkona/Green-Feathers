org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

minecraft_version=1.21.11
java_version=25
java_release=21
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=1.21.11
minecraft_version_range=[1.21.11,1.22)
neo_version=21.11.45
neo_version_range=[21.11.45,)
loader_version_range=[4,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.0
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

# Optional compat targets: Modrinth version ids for NeoForge 1.21.11 (the version number in the comment), since many
# mods share version numbers between their NeoForge and Fabric files.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository)
droplets_of_thirst_version=1.21.11-1.0.0
# Tough As Nails 21.11.0.4
tough_as_nails_version=6zSGsGJC
# Serene Seasons 21.11.0.5
serene_seasons_version=IsO9cQ47
# GlitchCore 21.11.0.4
glitchcore_version=6dbbrOrO
# AppleSkin 3.0.8+mc1.21.11
appleskin_version=MH9ov9DW
# Jade 21.1.7+neoforge
jade_version=LDFqgwEA
# Overflowing Bars 21.11.0 and Puzzles Lib 21.11.13
overflowing_bars_version=kGlv1ZGe
puzzles_lib_version=HOkyIMYP
curios_version=14.0.0+1.21.11
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
droplets_of_thirst_range=[1.21.11-1.0.0,1.21.11-2)
tough_as_nails_range=[21.11.0.4,21.12)
serene_seasons_range=[21.11.0.5,21.12)
overflowing_bars_range=[21.11.0,21.12)
curios_range=[14.0.0,15)
jade_range=[21.1.7,21.2)
