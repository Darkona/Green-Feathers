org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.3
java_version=25
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=26.3
minecraft_version_range=[26.3,26.4)
# NeoForge 26.3 is in beta. 26.3.0.37-beta renames the config types (COMMON and SERVER become LOCAL and SYNCED): a
# jar built against one side of that change does not load on the other. Built against 26.3.0.36-beta, like Droplets
# of Thirst 26.3-1.0.0.
neo_version=26.3.0.36-beta
neo_version_range=[26.3.0.36-beta,26.3.0.37-beta)
loader_version_range=[12,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.0-beta.2
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

# Optional compat targets: Modrinth version ids for NeoForge 26.3 (the version number in the comment), since many
# mods share version numbers between their NeoForge and Fabric files.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository)
ci_deps=droplets-of-thirst:droplets_of_thirst_version
droplets_of_thirst_version=26.3-1.0.0-beta.1
# Serene Seasons 26.1.2.0.7, the build for 26.3 despite its number
serene_seasons_version=QnvW5HPm
# GlitchCore 26.3.0.0.3
glitchcore_version=5FMzBcg1
# AppleSkin 3.0.10+mc26.3
appleskin_version=6vok7cLb
# Jade 26.3.1+neoforge
jade_version=bzrrwapQ
# Overflowing Bars 26.3.0 and Puzzles Lib 26.3.8 (26.3.9 needs a NeoForge newer than 26.3.0.36-beta)
overflowing_bars_version=bM6ZtP4a
puzzles_lib_version=nBKH6s5r
# Naturalist 2.0.6+26.3-neoforge and GeckoLib 5.5.7
naturalist_version=B3MaFfBt
geckolib_version=2s1O42FX
curios_version=17.0.0-beta.2+26.3
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
droplets_of_thirst_range=[26.3-1.0.0-beta.1,26.3-2)
serene_seasons_range=[26.1.2.0.7,26.1.3)
overflowing_bars_range=[26.3.0,26.4)
curios_range=[17.0.0-beta.2,18)
jade_range=[26.3.1,26.4)
