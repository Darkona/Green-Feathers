org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.1.2
java_version=25
# Minecraft version in the jar and mod version: the short name of the branch (26.1 covers its hotfixes)
minecraft_label=26.1
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.112
neo_version_range=[26.1.2.112,)
loader_version_range=[4,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.0
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

# Optional compat targets: Modrinth version ids for NeoForge 26.1.2 (the version number in the comment), since many
# mods share version numbers between their NeoForge and Fabric files.
# Droplets of Thirst comes from mavenLocal (publishToMavenLocal in its repository)
droplets_of_thirst_version=26.1-1.0.0
# Tough As Nails 21.11.0.6
tough_as_nails_version=VkY8qAjg
# Serene Seasons 26.1.2.0.4 (26.1.2.0.7 overflows the stack in its own Biome#hasPrecipitation mixin on the client)
serene_seasons_version=OKhFVuHv
# GlitchCore 26.1.2.0.2
glitchcore_version=mYUbCfgT
# AppleSkin 3.0.9+mc26.1
appleskin_version=i8MiVItH
# Jade 26.1.11+neoforge
jade_version=5jKeKXwB
# Overflowing Bars 26.1.0 and Puzzles Lib 26.1.15
overflowing_bars_version=lechTFMr
puzzles_lib_version=RTC7EJbD
curios_version=15.0.0+26.1.2
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
droplets_of_thirst_range=[26.1-1.0.0,26.1-2)
tough_as_nails_range=[21.11.0.6,22)
serene_seasons_range=[26.1.2.0.4,26.1.3)
overflowing_bars_range=[26.1.0,26.2)
curios_range=[15.0.0,16)
jade_range=[26.1.11,26.2)
