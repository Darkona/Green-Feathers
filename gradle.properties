org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.18.2
parchment_mappings_version=2022.11.06

minecraft_version=1.18.2
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=1.18.2
minecraft_version_range=[1.18.2]
forge_version=40.3.12
# Forge 40.2.3 is the first to apply mixins from jar-in-jar libraries (MixinExtras).
forge_version_range=[40.2.3,)
loader_version_range=[40,)

mod_id=feathers_of_fatigue
archives_base_name=feathers-of-fatigue
mod_name=Feathers of Fatigue
mod_license=GPL-3.0
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=2.0.0
mod_group_id=com.darkona.feathersoffatigue
mod_authors=Elenai, Darkona
mod_description=Feathers of Fatigue is a fork of Feathers, a stamina system for Minecraft, it adds a row of feathers to the hotbar to be spent by other mods, as well as an armor weight system to the game.

mixinextras_version=0.4.1

# Optional compat targets (Modrinth version ids, 1.18.2 Forge; the version number is in the comment)
# Cold Sweat 2.4.3
cold_sweat_version=YNEOXChH
# Thirst Was Taken 1.18.2-1.3.11
thirst_was_taken_version=ys4nvqH6
# Tough As Nails 7.0.0.73
tough_as_nails_version=9y5RMfoL
# Serene Seasons 7.0.0.15
serene_seasons_version=k8G3p1jL
# AppleSkin 2.5.1+mc1.18.2
appleskin_version=1ZaL0ACn
# Jade 5.3.2
jade_version=L2um3gq1
# Naturalist 1.1.1
naturalist_version=A4D0ssAc
# GeckoLib 3.0.57
geckolib_version=wwh0ZFLu
# Overflowing Bars v3.0.0-1.18.2-Forge
overflowing_bars_version=KaC0GODt
# Puzzles Lib v3.5.10-1.18.2-Forge
puzzles_lib_version=IIordDD2
curios_version=1.18.2-5.0.9.2
# Versions the optional compats accept (mods.toml): from the version compiled and tested against, up to the next
# major version. A mod outside its range stops the game at load with a message, instead of a crash in a tick.
cold_sweat_range=[2.4.3,3)
thirst_range=[1.18.2-1.3.11,1.18.2-2)
overflowing_bars_range=[3.0.0,4)
curios_range=[1.18.2-5.0.9.2,1.18.2-6)
jade_range=[5.3.2,6)
