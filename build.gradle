plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

// The public API lives in its own source set and ships twice: inside the mod jar, and alone as
// greenfeathers-api for other mods to compile against.
sourceSets {
    api
}

repositories {
    mavenCentral()
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.api)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Headless client straight into a copy of a world: scripts or `xvfb-run ./gradlew runBootCheck`.
        bootCheck {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1280', '--height', '720', '--quickPlaySingleplayer', 'gfboot'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation sourceSets.api.output

    // Optional compat: every use sits behind a ModList check.
    compileOnly "maven.modrinth:cold-sweat:${cold_sweat_version}"
    compileOnly "maven.modrinth:thirst-was-taken:${thirst_was_taken_version}"
    compileOnly "maven.modrinth:tough-as-nails:${tough_as_nails_version}"
    compileOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
    compileOnly "maven.modrinth:legendary-survival-overhaul:${lso_version}"
    compileOnly "maven.modrinth:overflowing-bars:${overflowing_bars_version}"
    compileOnly "maven.modrinth:puzzles-lib:${puzzles_lib_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

// Compat mods on the dev runtime, for boot checks and GameTests with them loaded:
//   ./gradlew runGameTestServer -Pcompat=coldsweat,thirst,overflowingbars
//   ./gradlew runGameTestServer -Pcompat=toughasnails,sereneseasons
def compatRuntime = [
        coldsweat      : ["maven.modrinth:cold-sweat:${cold_sweat_version}"],
        thirst         : ["maven.modrinth:thirst-was-taken:${thirst_was_taken_version}"],
        toughasnails   : ["maven.modrinth:tough-as-nails:${tough_as_nails_version}", "maven.modrinth:glitchcore:${glitchcore_version}"],
        sereneseasons  : ["maven.modrinth:serene-seasons:${serene_seasons_version}", "maven.modrinth:glitchcore:${glitchcore_version}"],
        lso            : ["maven.modrinth:legendary-survival-overhaul:${lso_version}"],
        appleskin      : ["maven.modrinth:appleskin:${appleskin_version}"],
        overflowingbars: ["maven.modrinth:overflowing-bars:${overflowing_bars_version}", "maven.modrinth:puzzles-lib:${puzzles_lib_version}"],
]
if (project.hasProperty('compat')) {
    dependencies {
        project.property('compat').toString().split(',').each { name ->
            def coordinates = compatRuntime[name.trim()]
            if (coordinates == null) throw new GradleException("Unknown compat '${name}'. Known: ${compatRuntime.keySet().join(', ')}")
            coordinates.each { localRuntime it }
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from sourceSets.api.output
}
tasks.named('sourcesJar', Jar) {
    from sourceSets.api.allSource
}

var apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = "${mod_id}-api"
    from sourceSets.api.output
}
var apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = "${mod_id}-api"
    archiveClassifier = 'sources'
    from sourceSets.api.allSource
}
tasks.named('assemble') { dependsOn apiJar, apiSourcesJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
        register('api', MavenPublication) {
            artifactId = "${mod_id}-api"
            artifact apiJar
            artifact apiSourcesJar
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
